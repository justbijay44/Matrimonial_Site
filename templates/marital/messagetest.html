<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .profile-icon {
          color: #12151a;
        }
      
        .chat-container {
          flex: 1;
        }
      
        #chatbox {
          background-color: #f8f9fa;
          overflow-y: auto;
          height: calc(100vh - 180px);
          padding: 10px;
        }
      
        .chat-message {
          border-radius: 8px;
          padding: 10px;
          display: flex;
          width: fit-content;
          margin-bottom: 10px;
          clear: both;
        }
      
        .chat-message.sender {
          background-color: #e9ecef;
          color: #333;
          margin-left: auto;
          text-align: right;
        }
      
        .chat-message.receiver {
          background-color: #007bff;
          color: white;
          margin-right: auto;
          text-align: left;
        }
      
        .chat-input {
          background-color: white;
        }
      
        .chat-input button {
          border-top-left-radius: 0;
          border-bottom-left-radius: 0;
          background: #007bff;
          color: white;
          border: none;
        }
      
        .chat-input button:hover {
          background: #0056b3;
        }
      
        .sidebar {
          background-color: #2c3e50;
          overflow-y: auto;
          height: 100vh;
        }
      
        .sidebar a {
          background: #2c3e50;
          color: white;
        }
      
        .sidebar i {
          color: white;
        }
      
        .chats .list-group-item {
          border: none;
          border-bottom: 1px solid #435f7a;
          padding: 15px 20px;
          font-size: 16px;
          width: 100%;
        }
      
        .chats .list-group-item:hover {
          background-color: #435f7a;
          color: white;
        }
      
        .active {
          background-color: #007bff !important;
          color: white;
        }
      
        .logout {
          position: absolute;
          bottom: 0;
          width: 100%;
          padding: 10px;
          background-color: #2c3e50;
        }
      
        .no-messages {
          text-align: center;
          color: #666;
        }
      </style>
</head>
<body>
    <div class="container">
        <div class="row-100">
            <div class="col-3 sidebar p-3 chats">
                <h5 class="mb-3 text-white">Chats</h5>
                <div class="contacts">
                  <a href="#"
                     class="list-group-item list-group-item-action"
                     data-id="">
                    <div class="d-flex align-items-center">
                      <img src="/static/images/hero_bg.jpg"
                           alt="{{ item.user.username }}'s Profile"
                           class="rounded-circle mr-2"
                           style="width: 40px; height: 40px; object-fit: cover">
                      <div class="w-100">
                        
                      </div>
                    </div>
                  </a>
                </div>
                <div class="logout">
                  <h5 class="text-white"><i class="fas fa-user"></i>Username</h5>
                  <h5 style="cursor: pointer; font-size: 1rem; margin-top: 5px">
                    <i class="fas fa-sign-out-alt" style="color: red"></i>
                    <a href="#" class="text-white">Go Back</a>
                  </h5>
                </div>
              </div>
        </div>
    </div>
</body>
</html>
